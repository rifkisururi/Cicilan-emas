# Docker Compose untuk Development dengan PostgreSQL Container
# Gunakan: docker-compose -f docker-compose.local.yml up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cicilan-emas-db
    environment:
      POSTGRES_DB: cicilan_emas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicilan-emas-network
    restart: unless-stopped

  # Node.js Application
  app:
    build: .
    container_name: cicilan-emas-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cicilan_emas_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SESSION_SECRET=cicilan-emas-secret-key-2024
      - UPLOAD_DIR=src/public/uploads
      - MAX_FILE_SIZE=5242880
    volumes:
      - ./src/public/uploads:/app/src/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cicilan-emas-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cicilan-emas-network:
    driver: bridge
